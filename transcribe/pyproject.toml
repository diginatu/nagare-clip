[project]
name = "nagare-transcribe"
version = "0.1.0"
description = "Haas-ASR + Silero VAD worker for nagare-clip (run as a subprocess)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "haas-asr @ git+https://github.com/third-intelligence/Haas-ASR.git@acc614f68769dcbfae9dba96b48439c4a66295af",
    "silero-vad>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nagare_transcribe"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
compile-bytecode = true
constraint-dependencies = ["torch==2.14.0", "triton==3.8.0", "numba==0.67.0"]
override-dependencies = [
    "fsspec[http]>=2026.6.0",
    "hydra-core>=1.3.8",
    "packaging>=26.3",
    "transformers>=5.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
