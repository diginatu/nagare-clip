# Example configuration for nagare-clip pipeline.
# Copy to your project and pass via --config flag.
# All values shown are the defaults; remove or comment out any you don't want.
#
# LLM provider selection (applies to every LLM stage below):
#   Set `provider` to one of: ollama_chat (default, local), openai, gemini, anthropic.
#   `model` is the provider's model name; LiteLLM receives "<provider>/<model>".
#   For cloud providers set `api_key` (or the provider's env var, e.g.
#   OPENAI_API_KEY / GEMINI_API_KEY / ANTHROPIC_API_KEY) and leave `api_base` empty.
#
# Langfuse tracing (optional, off unless keys are present):
#   Export LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY to enable tracing. Disable
#   via general.langfuse: false or NAGARE_LANGFUSE=0.

general:
  log_level: INFO   # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_file: ""   # Path to log file; empty = console only (run_pipeline.sh sets this automatically)
  llm_report: true   # write a per-call LLM report under output/llm_report/
  llm_report_dir: "output/llm_report"
  langfuse: true   # send LLM traces to Langfuse when LANGFUSE_PUBLIC_KEY/SECRET_KEY are set (false to force-disable)
  image_markup: html   # How the reviewable markdown files (publish.md, render.md) embed images: html = <img> tags (sized), markdown = ![alt](path) for viewers that strip raw HTML. A property of your viewer, so it is set once here

# project: the editorial brief for this project (all fields optional, free text).
# Whatever is set here is appended to the system prompts of the summary, plan,
# director and text_filter stages, so those LLMs know what the transcript cannot
# tell them: who the video is for, how long it should be, how it should feel, and
# what happened previously in a series. Leave everything empty (the default) and
# every prompt is byte-identical to a run without this section.
project: {}
  # audience: "DIY hobbyists on YouTube, already familiar with the build"   # Who the video is for
  # purpose: "show whether the siphon overflow drain actually works"   # What the video is trying to achieve
  # target_duration: "about 12 minutes"   # Desired finished length (free text); guides how aggressively to cut
  # tone: "fast, punchy vlog; frequent on-screen captions"   # Desired feel/pacing of the finished video
  # story_so_far: "the previous episode built the rig; this one tests it"   # Series context the transcript never states
  # previous_summary: "../previous-project/output/summary/summary.json"   # Path to a previous project's summary.json; its overall summary is added to the brief

transcription:
  compute_type: float16
  batch_size: 16
  language: ja   # ISO 639-1 language code passed to WhisperX (e.g. ja, en)
  # align_model: vumichien/wav2vec2-large-xlsr-japanese

# audio_silence stage: audio-silence (jump-cut) detection.
# Runs ffmpeg silencedetect on the waveform and writes an editable
# {stem}_cuts.txt checkpoint. NOTE: this is acoustic silence, distinct
# from intervals.silence_threshold (which is a WhisperX word-gap heuristic).
audio_silence:
  enabled: true   # false = write an empty cut list (no audio cuts applied)
  noise: -30.0   # ffmpeg silencedetect noise threshold, in dB
  min_silence: 0.8   # ffmpeg silencedetect minimum silence duration, seconds

# sentence_split stage: runs per source between audio_silence and text_filter.
# An LLM re-segments the WhisperX transcript into one-sentence-per-line units
# (rewriting {stem}.json and {stem}.txt). Disabled by default = byte-identical
# copy-through (no behaviour change).
sentence_split:
  enabled: false   # Enable LLM sentence re-segmentation
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "gpt-oss:120b"   # Model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.2
  reasoning_effort: null
  timeout: 300
  response_format: json
  max_retries: 2   # Extra attempts on LLM error / invalid ranges (0 = single attempt)
  retry_temp_step: 0.2
  retry_temp_cap: 0.8
  window_segments: 20   # Segments per LLM window (the batch size); a window carries its trailing sentence to the next
  force_split: true   # Force a sentence boundary at long audio_silence spans (post-enforced on LLM output; no extra LLM calls)
  force_split_min_silence: 3.0   # Seconds; only audio_silence cut spans at least this long force a split
  # prompt: "..."   # Bunsetsu-grouping prompt (has a sensible default)

# gap_context stage: runs per video between sentence_split and summary. Long
# silent spans from the audio_silence cut list are snapshotted (up to 3 frames
# each, via ffmpeg in the whisperx image) and described by a VISION LLM, so the
# summary and director stages can see what happens on screen while nobody is
# speaking (and keep a gap worth watching). Output {stem}_gaps.json is a
# reviewable intermediate. Disabled by default (writes an empty gap list = no-op).
gap_context:
  enabled: false   # Enable the gap_context vision LLM
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "qwen2.5vl:7b"   # A VISION-capable model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.2
  reasoning_effort: null
  timeout: 300
  max_retries: 2   # Extra attempts on LLM error / empty response (0 = single attempt)
  retry_temp_step: 0.2
  retry_temp_cap: 0.8
  min_gap: 3.0   # Only silent spans at least this long (seconds) get snapshots
  frame_width: 960   # Downscale width (px) of the extracted JPEG frames; height is auto
  static_ssim: 0.96   # Skip the vision call when the minimum SSIM across the gap's consecutive extracted-frame pairs is at least this (pixel-static prefilter; the gap is recorded as static). 0 disables
  context_lines: 1   # Transcript lines given to the vision LLM on each side of the gap (0 = none)
  # prompt: "..."   # System prompt (has a sensible default)

# summary stage: runs once project-wide (over all videos) between sentence_split
# and text_filter. A larger LLM segments each transcript into line-range parts
# and summarises each (also listing misspelling-prone keywords per video), then
# a reduce step writes one all-videos summary. Output summary.json is a
# reviewable intermediate consumed by the text_filter, plan and director stages.
# Disabled by default (writes an empty summary = no-op).
summary:
  enabled: false   # Enable the summary LLM
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "gpt-oss:120b"   # A larger model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.3
  reasoning_effort: null
  timeout: 300
  response_format: json
  max_retries: 2   # Extra attempts on LLM error / unparseable JSON (0 = single attempt)
  retry_temp_step: 0.2
  retry_temp_cap: 0.8
  # prompt: "..."   # Per-video segment+summarise prompt (has a sensible default)
  # overall_prompt: "..."   # All-videos reduce prompt (has a sensible default)

# text_filter stage: text editing checkpoint.
text_filter:
  use_llm: false   # Enable LLM text filter for the text-editing checkpoint
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "qwen3.5:4b"   # Model name (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  batch_size: 10   # Number of transcript segments per LLM call
  timeout: 60   # API request timeout in seconds
  retry_on_invalid: true   # On mangled lines, retry just those with a halved batch size
  retry_min_batch_size: 1   # Floor for the halving retry; set equal to batch_size to disable
  # prompt: "..."   # System prompt for LLM (has sensible default for Japanese)
  temperature: 0.1   # LLM sampling temperature
  reasoning_effort: null   # Passed to LiteLLM as reasoning_effort, unchanged (e.g. "none"/"low"/"high"); null sends nothing
  # keywords: []   # Constant keywords always injected into the filter LLM prompt

# plan stage: runs once project-wide after summary, before director. A larger
# LLM reads the per-part summaries (with line ranges) of all videos and gives a
# coarse, cross-video editorial direction per part. Output plan.json is a
# reviewable intermediate consumed by director. Disabled by default (no-op).
plan:
  enabled: false   # Enable the plan LLM
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "gpt-oss:120b"   # A larger model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.3
  reasoning_effort: null
  timeout: 300
  response_format: json
  max_retries: 2   # Extra attempts on LLM error / unparseable JSON (0 = single attempt)
  retry_temp_step: 0.2
  retry_temp_cap: 0.8
  # prompt: "..."   # System prompt (has a sensible default)

# plan_revise stage: runs once project-wide between plan and director. It reads
# plan/plan.json and the conversation in plan_dialogue/history.md and revises the
# directions as operations (delete/add/update), writing plan_revise/plan.json --
# which director prefers over plan/plan.json. It makes NO LLM call unless a human
# turn is unanswered, and a plan re-run invalidates its output. Disabled by
# default (no-op).
plan_revise:
  enabled: false   # Enable the plan_revise LLM
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "gpt-oss:120b"   # A larger model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.3
  reasoning_effort: null
  timeout: 300
  response_format: json
  max_retries: 2   # Extra attempts on LLM error / unparseable JSON (0 = single attempt)
  retry_temp_step: 0.2
  retry_temp_cap: 0.8
  # prompt: "..."   # System prompt (has a sensible default)

# director stage (Pass A): a larger LLM reads the whole numbered transcript and
# emits high-level edit operations as {stem}_director.json. It never re-outputs
# the transcript text. Disabled by default (writes an empty op list = no-op).
director:
  enabled: false   # Enable the director LLM
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "gpt-oss:120b"   # A larger model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.2
  reasoning_effort: null
  timeout: 300
  response_format: json   # JSON mode for reliable parsing
  max_retries: 2   # Extra attempts on LLM error / unparseable JSON (0 = single attempt)
  retry_temp_step: 0.2   # Temperature increment added on each retry
  retry_temp_cap: 0.8   # Maximum temperature any retry uses
  chunk_lines: 40   # How many lines of the whole-video transcript one turn of the director's conversation is asked to review (approximately — it stops where the footage breaks). The turn cap per run is ceil(display lines / this) * 2 + 1 (the plan turn); reaching it fails the stage, and every accepted turn is already saved in the director's directory, so running it again continues
  pause_after_plan: false   # Stop the pipeline (exit 0) after the director writes its first plan, with a done mark in director/conversation.md: read director/plan.md, then delete the mark (or use scripts/director_say.sh) and run again
  max_keep_lines: 8   # Reject a "keep" op wider than this many lines (0 = no limit); a keep may span a continuous on-screen event, but one this wide is marking talking, not an event
  silence_line_min: 5.0   # Shortest wait between two lines (seconds) shown to the director as a silence line of its own, addressable as "n~"; a shorter one stays a `gap Xs` figure in the preceding line's bracket. Matches gap_context.min_gap by default, so every described gap has a line to land in. guided_edit writes the same silence lines into its _edits.txt, and check_edits/intervals use this value to know where they belong
  # prompt: "..."   # System prompt (has a sensible default)

# guided_edit stage (Pass B2): a small local LLM applies each director op,
# inserting <cut>/<speed>/<overlay>/<keep> tags (and {{old->new}} patches) into
# the verbatim _edits.txt, where the director's silence lines are written in
# so an op on "n~" is a marker too. Disabled by default (copies edits
# through, silence lines added).
guided_edit:
  enabled: false   # Enable applying director ops
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "qwen3.5:4b"   # The same small model as text_filter is fine (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.1
  reasoning_effort: null
  timeout: 60
  context_lines: 1   # Lines of context shown to the LLM around an "edit" op boundary
  max_retries: 2   # Extra attempts on LLM error / failed verification (0 = single attempt)
  retry_temp_step: 0.2   # Temperature increment added on each retry
  retry_temp_cap: 0.8   # Maximum temperature any retry uses
  # prompt: "..."   # System prompt (has a sensible default)

# intervals stage: patch application + keep-interval merge.
# Audio cuts from audio_silence are unioned here.
intervals:
  silence_threshold: 1.5   # WhisperX word-gap silence threshold, seconds (NOT the audio_silence detector)
  min_keep: 1.0   # Minimum keep interval length in seconds
  keep_pre_margin: 1.0   # Seconds to extend keep intervals before start
  keep_post_margin: 1.0   # Seconds to extend keep intervals after end
  min_cut: 0.4   # Merge adjacent keep intervals separated by less than this (seconds); absorbs cuts too short to be worth the jump, which margin arithmetic otherwise leaves behind as slivers. 0 disables
  caption:
    max_bunsetu: 12   # Maximum bunsetsu units per caption chunk
    max_duration: 4.0   # Maximum seconds per caption chunk
    min_bunsetu: 3   # Minimum bunsetsu before flushing chunk
    min_duration: 1.5   # Minimum seconds before flushing chunk
    silence_flush: 1.5   # Silence duration that forces chunk flush
    bunsetu_separator: " "   # Separator between bunsetsu units
    pre_margin: 0.0   # Seconds to extend each caption before its start (clamped to previous caption end)
    post_margin: 0.0   # Seconds to extend each caption after its end (clamped to next caption start)
  bunsetu:
    char_eps: 0.02
    silence_max_word_span: 0.6

# blender stage: Blender VSE layout.
blender:
  use_proxy: true   # Enable proxy on movie strips for smooth VSE playback
  proxy_size: 100   # Proxy render size percentage: 25 | 50 | 75 | 100
  # Render/output settings, written onto the scene so the .blend opens ready to
  # render instead of needing the encoder, resolution and audio set by hand every
  # time. Empty by default: what is not set here keeps coming from the first
  # source that plays (resolution and fps) or from Blender's own defaults.
  #
  # Every key is the Blender attribute name, forwarded verbatim to scene.render
  # (see bpy.types.RenderSettings); a nested mapping recurses into the sub-struct
  # of that name. Keys are applied in the order written, which matters where one
  # setting widens another's choices (image_settings.media_type: VIDEO is what
  # puts FFMPEG in file_format's enum at all). An unknown key is logged and
  # skipped; an invalid VALUE (a misspelt enum member) is a hard error, because
  # rendering with a codec other than the one asked for is a defect found only by
  # playing the file.
  #
  # fps given without fps_base resets fps_base to 1.0 -- the scene otherwise
  # carries the source's pulldown (1.001 for 29.97) and `fps: 30` would quietly
  # stay 29.97.
  render: {}
    # To use any of these, delete the `{}` above and uncomment the keys you want.
    # resolution_x: 1920
    # resolution_y: 1080
    # resolution_percentage: 100
    # fps: 30                        # Overrides the first source's measured fps
    # filepath: "//../renders/final"  # `//` is relative to the .blend, so `//../`
    #                                 # is output/ (the .blend sits in
    #                                 # output/blender/). Blender creates missing
    #                                 # directories; an absolute path also works.
    # image_settings:
    #   media_type: VIDEO             # Blender 5.x: VIDEO before file_format, which
    #   file_format: FFMPEG           # otherwise offers only the IMAGE formats.
    #                                 # Keys are applied in the order written here.
    # ffmpeg:
    #   format: MPEG4
    #   codec: H264
    #   constant_rate_factor: HIGH    # LOSSLESS|PERC_LOSSLESS|HIGH|MEDIUM|LOW|...
    #   ffmpeg_preset: GOOD           # BEST | GOOD | REALTIME
    #   gopsize: 18
    #   audio_codec: AAC              # NONE | AAC | AC3 | FLAC | MP2 | MP3 | OPUS | PCM | VORBIS
    #   audio_bitrate: 192
    #   audio_mixrate: 48000
    #   audio_channels: STEREO
  caption_style:
    font_size: 50
    alignment_x: CENTER   # LEFT | CENTER | RIGHT
    anchor_y: BOTTOM   # TOP | CENTER | BOTTOM
    location_x: 0.5   # Horizontal position (0.0 - 1.0)
    location_y: 0.05   # Vertical position (0.0 - 1.0)
    use_shadow: true   # Enable text shadow
    wrap_width: 0.9   # Text wrap width (0.0 = no wrap, 0.0 - 1.0)
    # font: /abs/path/to/MyFont.ttf   # Absolute path to a font file; loaded as a Blender VectorFont.
    # color: [1, 1, 1, 1]             # Font fill color (RGBA, 0.0 - 1.0); default white
    # color: "#FFCC00"                # ...or a hex string, alpha optional (#RRGGBBAA)
    # use_outline: false              # Enable text outline
    # outline_color: [0, 0, 0, 1]     # Outline color (RGBA)
    # use_box: false                  # Enable background box behind text
    # box_color: [0, 0, 0, 0.5]       # Box color (RGBA)
    # Any color key (color / *_color) takes either form. To copy a color OUT of
    # Blender, use the color picker's Hex field -- NOT Ctrl-C on the swatch, which
    # linearises the value and pastes back visibly darker (0.5 copies as 0.214).
    # Any other key is forwarded verbatim to the Blender TextStrip attribute of the
    # same name (see bpy.types.TextStrip), e.g. shadow_color / shadow_offset /
    # shadow_blur / box_margin. An unknown key is logged and skipped.
  # Overlay TEXT strip style for <overlay text="..." duration="N.N"/> markers.
  # Any field not set here is inherited from caption_style.
  overlay_style:
    anchor_y: TOP   # default: TOP (overlays sit at top of frame)
    location_y: 0.95   # default: 0.95
    # font_size: 50       # inherits from caption_style if omitted
    # alignment_x: CENTER
    # location_x: 0.5
    # color: [1, 1, 1, 1]  # overrides caption_style (or a hex string, e.g. "#FFCC00")
  # Speed-up mark: auto on-screen badge over every <speed> region.
  speed_mark:
    enabled: true   # set false to disable all speed badges
    template: "x{factor}"   # {factor} is the speed factor (one decimal, e.g. 2.0)
    font_size: 35
    alignment_x: RIGHT
    anchor_y: TOP
    location_x: 0.95
    location_y: 0.95
    # color: [1, 1, 1, 1]   # Font fill color (RGBA or hex); overrides caption_style

# publish stage: runs once project-wide AFTER blender. An LLM turns the summaries
# and the project brief into several title candidates, a description lead, chapter
# titles and alternative thumbnail-copy sets (WORDS only -- see pairing below);
# the chapter TIMESTAMPS are computed from the finished timeline (keep intervals +
# speed ranges), which exists nowhere else. Stills are extracted at the moments the
# director marked as payoffs and shown in publish.md beside the copy.
# Compositing is NOT done here: the render stage (below) reads publish.json and
# runs ImageMagick, so a hook or a background can be hand-edited and re-rendered
# without paying for the copy again. Uploading, and picking which rendered set to
# ship, stay manual. Disabled by default (no-op).
#
# Cost of one enabled run: the copy call, plus the pairing call, plus one VISION
# call per candidate still that does not already have a description (see
# describe_frames).
publish:
  enabled: false   # Enable the publish LLM
  provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
  api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
  model: "gpt-oss:120b"   # A larger model (passed to LiteLLM as "<provider>/<model>")
  api_key: ""   # API key for the provider (or set the provider's env var)
  temperature: 0.7   # Higher than the editing stages: title and hook candidates should differ from each other
  reasoning_effort: null
  timeout: 300
  response_format: json
  max_retries: 2   # Extra attempts on LLM error / unparseable JSON (0 = single attempt)
  retry_temp_step: 0.2
  retry_temp_cap: 0.8
  min_chapter_duration: 10.0   # YouTube ignores a chapter list unless every chapter is at least this long; a shorter one is merged into a neighbour
  max_frames: 24   # Cap on thumbnail candidate stills (0 = no limit); overlays outrank keeps
  frame_width: 1280   # Downscale width (px) of the extracted JPEG stills; height is auto
  # prompt: "..."   # System prompt (has a sensible default)
  # Frame description: one VISION call per candidate still, describing what is
  # actually legible in it, where the subject sits and which regions are empty --
  # the director's label says what it THOUGHT was happening at that moment, only
  # looking says what a viewer can make out. The pairing step below uses these to
  # put each headline on a frame that shows what it promises.
  #
  # Cost: up to publish.max_frames calls the first time (24 by default), then only
  # for frames whose picture CHANGED. Results are cached in publish/frames.json by
  # a content hash of the JPEG itself, so re-running publish for better copy over
  # an unchanged shortlist costs nothing, and a description you rewrite by hand is
  # the description from then on.
  #
  # OFF by default because it needs a VISION-capable model and the rest of publish
  # needs a text one: a project that has only configured publish.model would
  # otherwise fire two dozen vision calls at a model that cannot see. Turning it
  # off is not a no-op the way disabling a stage is -- frames.json is still written
  # with the shortlist fields and hashes, so descriptions can be written by hand and
  # are reused when this is switched on. Without descriptions the pairing call still
  # runs, on the director's labels alone.
  describe_frames:
    enabled: false   # Enable the frame-description vision LLM
    provider: ollama_chat   # LiteLLM provider prefix: ollama_chat | openai | gemini | anthropic
    api_base: ""   # Base URL; empty -> Ollama localhost default; leave empty for cloud providers
    model: "qwen2.5vl:7b"   # A VISION-capable model (passed to LiteLLM as "<provider>/<model>")
    api_key: ""   # API key for the provider (or set the provider's env var)
    temperature: 0.2
    reasoning_effort: null
    timeout: 300
    max_retries: 2   # Extra attempts on LLM error / empty response (0 = single attempt)
    retry_temp_step: 0.2
    retry_temp_cap: 0.8
    # prompt: "..."   # System prompt (has a sensible default)
  # Pairing: a second, text-only call that puts each thumbnail headline on the
  # frame that shows what it promises, and decides where the text sits and in what
  # colour -- from the frame DESCRIPTIONS above, never from images, and naming its
  # frame by INDEX (publish resolves that to a path before writing publish.json).
  # It is kept apart from the copy call because two dozen frame descriptions in
  # front of that one makes it caption the photographs it can see instead of
  # writing hooks from the story.
  #
  # Cost: exactly one extra text call per publish run, whatever the shortlist size.
  # It needs NO new model -- it uses publish's own provider/model/api_base/api_key,
  # AND publish's own sampling settings, since it is the same kind of call on the
  # same model: a key left unset below means "inherit", not "use my own idea of a
  # good temperature". That matters because some models accept exactly one
  # temperature (claude-sonnet-5 wants 1.0) and reject anything else before the
  # request leaves the machine.
  #
  # ON by default, unlike describe_frames, because the copy call no longer chooses
  # colours or placement at all: turning this off is not a no-op but a fallback to
  # the four built-in presets on one shared background -- which is what a project
  # renders with no pairing at all, and is a downgrade rather than nothing.
  pairing:
    enabled: true   # Run the pairing call
    # temperature: 0.2   # Sampling temperature; unset = publish.temperature
    # max_retries: 2   # Extra attempts; unset = publish.max_retries
    # retry_temp_step: 0.2   # Unset = publish.retry_temp_step
    # retry_temp_cap: 0.8   # Unset = publish.retry_temp_cap
    # prompt: "..."   # System prompt (has a sensible default)

# render stage: the LAST stage, and the only one that never makes an LLM call.
# It reads output/publish/publish.json -- the hand-editable contract -- and
# composites one thumbnail per copy set with ImageMagick (`magick` must be on
# PATH), each onto the background that set names (a path relative to
# output/publish/, or absolute; any aspect ratio, cropped to fill). Renders land
# in output/render/thumbnails/ beside render.json and render.md. Edit a hook or
# a background in publish.json and re-run --from-stage render --to-stage render:
# zero calls, every time. Only `fonts` is set here, because the model cannot know
# what is installed -- and SET IT if your copy is not plain ASCII: ImageMagick's
# default face draws nothing at all (not even a box) for a character it has no
# glyph for, so a CJK headline comes back invisible.
render:
  enabled: true   # Render a thumbnail per copy set
  width: 1280   # Canvas width in px
  height: 720   # Canvas height in px
  line_gap: 12   # Vertical gap between stacked lines in px
  # fonts: {sans-bold: "Noto-Sans-CJK-JP-Bold", serif-black: "Noto-Serif-CJK-JP-Black"}   # Font slots the pairing call may choose from: slot name -> ImageMagick font name or path. THE FIRST ONE LISTED is also the fallback face for any line that named no slot (a preset cannot name one), so put a font that covers your language first. Leave this empty and ImageMagick's default face is used, which draws nothing at all for a CJK character

# cut_report: deterministic metrics + checks on the FINISHED cut (no LLM call).
# Runs after intervals (again after blender, with Blender's own warnings) and
# writes a section into llm_report/index.md next to the order note.
# The measurements always print; only a breached threshold is flagged.
cut_report:
  enabled: true   # Write the finished-cut section into the LLM report
  caption_chars_per_sec: 18.0   # Flag a caption authored at or above this many characters per second. One inside a speed_range is flagged separately: the factor divides its on-screen time again, which is how a real run shipped 0.2s captions
  timelapse_max_screen: 180.0   # Flag a timelapse that plays for more than this many seconds on screen -- a factor picked too low leaves a sustained fast-forward, a failure mode this pipeline hits repeatedly. There is deliberately NO floor: a short timelapse is ordinary, and its on-screen length is reported as a measurement instead
  min_keep_fragment: 1.0   # Flag a keep interval shorter than this (seconds). Inter-keep GAPS are checked against intervals.min_cut instead -- that is the pass that owns them

pipeline:
  input_videos_dir: src_video
  output_dir: output   # Root dir; stage outputs go to per-stage named subdirs
  from_stage: transcription   # Start from this stage; reuses earlier stage outputs
  to_stage: render   # Stop after this stage (inclusive). Must not precede from_stage
